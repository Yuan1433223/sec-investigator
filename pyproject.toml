[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sec-investigator"
version = "0.1.0"
description = "Constrained-autonomy security investigation agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.119.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langgraph==1.1.9",
    "langgraph-checkpoint-postgres",
    "langgraph-checkpoint-sqlite",
    "loguru>=0.7.3",
    "httpx>=0.27.0",
    "elasticsearch>=8.0",
    "pymilvus>=2.4",
    "pymongo>=4.6",
    "numpy>=1.26",
    "langchain-anthropic>=1.4.1",
    "aiohttp>=3.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "anyio[trio]",
    "ruff>=0.6",
    "mypy>=1.10",
    "respx>=0.23.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/runtime", "src/security", "src/surfaces"]

[project.scripts]
sec-investigator = "surfaces.api.app:_serve"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
