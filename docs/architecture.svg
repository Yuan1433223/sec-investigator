<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 900" width="1040" height="900" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#7a8aa8"/>
    </marker>
    <linearGradient id="gSurf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2fb"/><stop offset="1" stop-color="#e3e9f7"/>
    </linearGradient>
    <linearGradient id="gRun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eafaf1"/><stop offset="1" stop-color="#ddf4e7"/>
    </linearGradient>
    <linearGradient id="gSec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf3e7"/><stop offset="1" stop-color="#f9ead6"/>
    </linearGradient>
  </defs>

  <!-- title -->
  <text x="520" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">sec-investigator — 系统架构</text>
  <text x="520" y="56" text-anchor="middle" font-size="13" fill="#5a6a88">受限自治安全调查 agent · LangGraph 状态机运行时 · runtime / security / surfaces 三层</text>

  <!-- ============ SURFACES ============ -->
  <g>
    <rect x="20" y="78" width="1000" height="118" rx="12" fill="url(#gSurf)" stroke="#9fb0d0"/>
    <text x="40" y="100" font-size="14" font-weight="700" fill="#24365c">surfaces · 入口与交付层（保持薄）</text>
    <rect x="40" y="112" width="200" height="70" rx="8" fill="#ffffff" stroke="#b7c3e0"/>
    <text x="140" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2a4a">REST API</text>
    <text x="140" y="160" text-anchor="middle" font-size="11" fill="#66758f">POST /investigate</text>
    <rect x="260" y="112" width="200" height="70" rx="8" fill="#ffffff" stroke="#b7c3e0"/>
    <text x="360" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2a4a">Webhook (Grafana)</text>
    <text x="360" y="160" text-anchor="middle" font-size="11" fill="#66758f">告警触发 · 去重</text>
    <rect x="480" y="112" width="200" height="70" rx="8" fill="#ffffff" stroke="#b7c3e0"/>
    <text x="580" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2a4a">SSE</text>
    <text x="580" y="160" text-anchor="middle" font-size="11" fill="#66758f">事件流 / 进度订阅</text>
    <rect x="700" y="112" width="200" height="70" rx="8" fill="#ffffff" stroke="#b7c3e0"/>
    <text x="800" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2a4a">Feishu 投递</text>
    <text x="800" y="160" text-anchor="middle" font-size="11" fill="#66758f">订阅 FinalEvent</text>
  </g>

  <!-- arrow surfaces -> runtime -->
  <line x1="520" y1="196" x2="520" y2="220" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="532" y="213" font-size="10" fill="#7a8aa8">invoke</text>

  <!-- ============ RUNTIME ============ -->
  <g>
    <rect x="20" y="222" width="1000" height="330" rx="12" fill="url(#gRun)" stroke="#8fc7a5"/>
    <text x="40" y="244" font-size="14" font-weight="700" fill="#1f5a3a">runtime · LangGraph 调查图（状态机）</text>

    <!-- asset_resolution -->
    <rect x="40" y="258" width="180" height="74" rx="8" fill="#ffffff" stroke="#7bb493"/>
    <text x="130" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#1f5a3a">asset_resolution</text>
    <text x="130" y="302" text-anchor="middle" font-size="10" fill="#5a7a6a">目标 → NodeMachine[]</text>
    <text x="130" y="318" text-anchor="middle" font-size="10" fill="#5a7a6a">inspection/capability scope</text>

    <!-- supervisor -->
    <rect x="270" y="258" width="180" height="74" rx="8" fill="#ffffff" stroke="#7bb493"/>
    <text x="360" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#1f5a3a">supervisor</text>
    <text x="360" y="302" text-anchor="middle" font-size="10" fill="#5a7a6a">确定性能力路由</text>
    <text x="360" y="318" text-anchor="middle" font-size="10" fill="#5a7a6a">LLM 只写任务说明</text>

    <!-- workers -->
    <rect x="500" y="258" width="500" height="150" rx="8" fill="#ffffff" stroke="#9cc8b2"/>
    <text x="750" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#1f5a3a">bounded specialists（worker）</text>
    <rect x="520" y="286" width="140" height="52" rx="6" fill="#f2fbf5" stroke="#a9d2bc"/>
    <text x="590" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#2a6b47">log_detective</text>
    <text x="590" y="325" text-anchor="middle" font-size="9" fill="#5a7a6a">ES / RAG 日志</text>
    <rect x="680" y="286" width="140" height="52" rx="6" fill="#f2fbf5" stroke="#a9d2bc"/>
    <text x="750" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#2a6b47">machine_check</text>
    <text x="750" y="325" text-anchor="middle" font-size="9" fill="#5a7a6a">Prom 节点·按资产 Send</text>
    <rect x="840" y="286" width="140" height="52" rx="6" fill="#f2fbf5" stroke="#a9d2bc"/>
    <text x="910" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#2a6b47">security_guard</text>
    <text x="910" y="325" text-anchor="middle" font-size="9" fill="#5a7a6a">CC/DDoS/WAF/GF</text>
    <!-- rollups -->
    <rect x="520" y="360" width="150" height="36" rx="6" fill="#e8f6ee" stroke="#b7d9c4"/>
    <text x="595" y="383" text-anchor="middle" font-size="10" fill="#2a6b47">machine_rollup</text>
    <rect x="840" y="360" width="150" height="36" rx="6" fill="#e8f6ee" stroke="#b7d9c4"/>
    <text x="915" y="383" text-anchor="middle" font-size="10" fill="#2a6b47">security_rollup</text>
    <text x="750" y="390" text-anchor="middle" font-size="9" fill="#7b9b8a">asset_findings → findings</text>

    <!-- approval + reporter -->
    <rect x="270" y="392" width="180" height="56" rx="8" fill="#fdf3e7" stroke="#d9a868"/>
    <text x="360" y="414" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5220">approval_gate (HITL)</text>
    <text x="360" y="432" text-anchor="middle" font-size="10" fill="#9a7a4a">critical → interrupt</text>
    <rect x="40" y="392" width="180" height="56" rx="8" fill="#ffffff" stroke="#7bb493"/>
    <text x="130" y="414" text-anchor="middle" font-size="12" font-weight="600" fill="#1f5a3a">reporter</text>
    <text x="130" y="432" text-anchor="middle" font-size="10" fill="#5a7a6a">结构化报告 artifact</text>

    <!-- flow arrows -->
    <line x1="220" y1="295" x2="270" y2="295" stroke="#4a7a5e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="450" y1="295" x2="500" y2="295" stroke="#4a7a5e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M750 408 L360 420" stroke="#c99a5a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M360 448 L230 430" stroke="#4a7a5e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="330" y="478" font-size="10" fill="#5a7a6a">approve → reporter · reject → END</text>

    <!-- cross-cutting runtime capabilities -->
    <rect x="40" y="470" width="960" height="66" rx="8" fill="#eef7f2" stroke="#a9d2bc"/>
    <text x="60" y="492" font-size="12" font-weight="600" fill="#2a6b47">cross-cutting runtime capabilities</text>
    <text x="60" y="516" font-size="11" fill="#4a6a5a">TypedState · Events 流 · Checkpoint (SQLite/Postgres) · 模型 profile 抽象 · Retry/Timeout · 工具预算 · tracing · replay</text>
  </g>

  <!-- arrow runtime -> security -->
  <line x1="520" y1="552" x2="520" y2="576" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="532" y="569" font-size="10" fill="#7a8aa8">call tools / policies</text>

  <!-- ============ SECURITY ============ -->
  <g>
    <rect x="20" y="578" width="1000" height="150" rx="12" fill="url(#gSec)" stroke="#d9b27a"/>
    <text x="40" y="600" font-size="14" font-weight="700" fill="#7a5220">security · 安全业务域</text>

    <rect x="40" y="612" width="210" height="100" rx="8" fill="#ffffff" stroke="#d9b27a"/>
    <text x="145" y="636" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5220">Adapters</text>
    <text x="145" y="656" text-anchor="middle" font-size="10" fill="#9a7a4a">ES · Prometheus</text>
    <text x="145" y="672" text-anchor="middle" font-size="10" fill="#9a7a4a">CC · DDoS · WAF · GF</text>
    <text x="145" y="688" text-anchor="middle" font-size="10" fill="#9a7a4a">RAG(Milvus+Mongo)</text>

    <rect x="270" y="612" width="210" height="100" rx="8" fill="#ffffff" stroke="#d9b27a"/>
    <text x="375" y="636" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5220">Collectors / Assets</text>
    <text x="375" y="656" text-anchor="middle" font-size="10" fill="#9a7a4a">NodeResolver · WAF/GF</text>
    <text x="375" y="672" text-anchor="middle" font-size="10" fill="#9a7a4a">NodeMachine / capabilities</text>

    <rect x="500" y="612" width="210" height="100" rx="8" fill="#ffffff" stroke="#d9b27a"/>
    <text x="605" y="636" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5220">Policies / Playbooks</text>
    <text x="605" y="656" text-anchor="middle" font-size="10" fill="#9a7a4a">EvidencePolicy(代码阈值)</text>
    <text x="605" y="672" text-anchor="middle" font-size="10" fill="#9a7a4a">playbook catalog</text>
    <text x="605" y="688" text-anchor="middle" font-size="10" fill="#9a7a4a">HITL 判定</text>

    <rect x="730" y="612" width="270" height="100" rx="8" fill="#ffffff" stroke="#d9b27a"/>
    <text x="865" y="636" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5220">Schemas / Tools / Report</text>
    <text x="865" y="656" text-anchor="middle" font-size="10" fill="#9a7a4a">findings · report · artifact</text>
    <text x="865" y="672" text-anchor="middle" font-size="10" fill="#9a7a4a">ES/Prom/Security/RAG tool 工厂</text>
  </g>

  <!-- ============ DATA SOURCES ============ -->
  <g>
    <rect x="20" y="748" width="1000" height="70" rx="12" fill="#f3f5fa" stroke="#c3ccdf"/>
    <text x="40" y="770" font-size="12" font-weight="600" fill="#44536e">数据源（可替换：DATA_SOURCE=fake 提供离线 fixture）</text>
    <text x="40" y="798" font-size="11" fill="#5a6a88">Elasticsearch · Prometheus · CC/DDoS · WAF/GF · RAG(Milvus+MongoDB) — 经 adapter seam 接入，测试/演示用 respx + fixture 离线化</text>
  </g>

  <text x="520" y="876" text-anchor="middle" font-size="11" fill="#7a8aa8">三层分层：runtime 不依赖 surfaces；阈值在代码；路由确定性；资产按能力驱动</text>
</svg>
