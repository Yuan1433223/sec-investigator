<title id="title">sec-investigator 系统架构与模型边界</title>
<desc id="desc">三个调查阶段按固定优先级调度，同类检查按资产并行。代码负责路由与分项定级，模型负责工具调查与报告，人工决定是否继续生成报告。底部列出验证状态和实现边界。</desc>
